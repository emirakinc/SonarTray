ShortDescription: Control the SteelSeries Sonar mixer from the notification area.
Description: |-
  A small tray application for the SteelSeries Sonar mixer. Right-click the tray icon for a
  compact mixer with volume, mute and output/input device selection for the Master, Game, Chat,
  Media and Microphone channels; left-click to bring up SteelSeries GG. Global shortcuts let you
  mute the microphone or change the master volume without leaving a game, and the tray icon is
  drawn from the current master volume.

  Talks to Sonar's local REST API only; it is not an official SteelSeries product.

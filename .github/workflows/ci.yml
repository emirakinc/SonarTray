name: ci

on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Format
        run: dotnet format SonarTray.sln --verify-no-changes --severity warn

      - name: Build
        run: dotnet build SonarTray.sln -c Release -warnaserror

      - name: Test
        run: dotnet test SonarTray.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Test sonuclari
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.sha }}
          path: "**/TestResults/*.trx"
          retention-days: 14

      - name: Publish (framework-dependent)
        run: >
          dotnet publish SonarTray.csproj -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o publish

      # Etiketten önce indirip deneyebilmek için: Actions → ilgili çalıştırma → Artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: SonarTray-win-x64-${{ github.sha }}
          path: publish/SonarTray.exe
          retention-days: 14

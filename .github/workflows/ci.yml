name: ci

on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build SonarTray.csproj -c Release -warnaserror

      - name: Publish (framework-dependent)
        run: >
          dotnet publish SonarTray.csproj -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o publish

      # Etiketten önce indirip deneyebilmek için: Actions → ilgili çalıştırma → Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: SonarTray-win-x64-${{ github.sha }}
          path: publish/SonarTray.exe
          retention-days: 14

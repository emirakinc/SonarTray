name: Hata bildirimi
description: Bir şey beklendiği gibi çalışmıyor
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Ne oldu?
      description: Beklediğin ve gördüğün davranışı kısaca yaz.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Adımlar
      placeholder: |
        1. Tepsi ikonuna sağ tıkla
        2. Game kanalının sesini kıs
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SonarTray sürümü
      placeholder: "v0.1.0 (release sayfasından indirilen paket ya da commit)"
    validations:
      required: true

  - type: input
    id: gg
    attributes:
      label: SteelSeries GG / Sonar sürümü
      placeholder: "GG 90.x — Sonar"

  - type: input
    id: windows
    attributes:
      label: Windows sürümü
      placeholder: "Windows 11 24H2"

  - type: textarea
    id: log
    attributes:
      label: Log
      description: '%LOCALAPPDATA%\SonarTray\sonartray.log dosyasının ilgili son satırları. Gerekirse `--verbose` ile tekrar dene.'
      render: text
